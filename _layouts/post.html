---
layout: default
---
<article>
    <h2>{{ page.title }}</h2>
    <p>
        <small>
            Posted on <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
            {% if page.tags.size > 0 %}
                | Tags: 
                {% for tag in page.tags %}
                    <a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
                {% endfor %}
            {% endif %}
        </small>
    </p>
    <hr>

    {{ content }}

    <hr>
    <p><a href="{{ '/' | relative_url }}">&lt;&lt; Back to Index</a></p>
</article>
